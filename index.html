<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the paper surface run under the status bar and home indicator;
         the layout pads the safe areas itself. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Momentum</title>
    <meta name="description" content="Momentum — a calm personal habit tracker. Check off your trackers each day, keep your streaks, and see the week take shape." />
    <meta name="color-scheme" content="light dark" />
    <!-- Matches --bg per scheme before React runs; App.tsx keeps it in sync with the chosen theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4EEE2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15110E" />
    <!-- iOS Home Screen: standalone window, translucent status bar over the paper, app title. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Momentum" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Absolute /icons/ hrefs are rewritten with Vite's base at build time. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/pwa-192.png" type="image/png" sizes="192x192" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
