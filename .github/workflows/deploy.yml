name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in progress and the
# latest queued one. Do NOT cancel an in-progress run: a production deployment that has started
# must be allowed to complete (this matches GitHub's own Pages starter workflow).
concurrency:
  group: pages
  cancel-in-progress: false

# Every action is pinned to a full commit SHA (the release named in the comment): a tag can be moved,
# and this job may publish the site that every installed copy of the app updates itself to.
# Dependabot (.github/dependabot.yml) proposes new SHAs, comment included, as releases appear.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Node 24 (current LTS) satisfies "engines" in package.json and the Firebase SDK's own >=24.12,
      # so npm ci installs without EBADENGINE warnings.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fail fast on a red unit-test suite so a broken build never ships. The script pins TZ itself.
      - run: npm test

      # The app is served from https://<user>.github.io/<repo>/, so Vite's base must be the repo name.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
